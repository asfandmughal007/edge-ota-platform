name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the image job asks for more, for itself only.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.component }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, backend]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q

  compose:
    name: compose file and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tls config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint scripts
        run: |
          pip install ruff
          ruff check scripts
          ruff format --check scripts
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  e2e:
    name: end-to-end OTA (compose)
    needs: [test, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DEVICE_MGMT_ADMIN_API_KEY=$(openssl rand -hex 24)"
            # The agents run as a non-root user; give them the docker group.
            echo "DOCKER_GID=$(getent group docker | cut -d: -f3)"
          } > .env
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Run the OTA scenario (upgrade, upgrade, broken release, rollback)
        run: python3 scripts/demo.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f edge-app-device-001 edge-app-device-002 edge-app-device-003 || true

  images:
    name: image ${{ matrix.name }}
    needs: [test, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
      id-token: write # keyless provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
            platforms: linux/amd64
          # Real edge hardware is often ARM, so the device-side images are multi-arch.
          - name: agent
            context: .
            file: agent/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: edge-app
            context: edge-app
            file: edge-app/Dockerfile
            platforms: linux/amd64,linux/arm64
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: commit SHA always; branch name; semver (1.2.3, 1.2) on v* tags;
      # `latest` only from the default branch. Image names are lowercased automatically.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The test app reports and labels its own version, which the agent verifies.
      - name: Resolve app version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Build once for scanning, locally and for one platform, before anything is published.
      - name: Build (scan copy)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: scan:${{ matrix.name }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan:${{ matrix.name }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: true
          sbom: true

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
